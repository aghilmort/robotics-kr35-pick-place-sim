<text x="632.0" y="518.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">no_contact_at_pick_point, suction_overload,</text>
<text x="632.0" y="534.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">pick_object_not_graspable, forbidden_contact_with_&lt;fixture&gt;</text>
<text x="632.0" y="576.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">Ran out of sim budget</text>
<text x="632.0" y="596.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">timeout_waiting_for_settle — max_sim_time_s</text>
<text x="632.0" y="612.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">exhausted during the final settle loop</text>
